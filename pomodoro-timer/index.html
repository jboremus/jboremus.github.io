<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>
  :root {
    --bg: #0d1a08;
    --surface: #16240e;
    --accent: #e8b04b;
    --break: #4bb1a0;
    --text: #e8e8ea;
    --muted: #7a856e;
    --glass-border: var(--glass-border);
  }
  body.hyper {
    --bg: #1a0e04;
    --surface: #241407;
    --accent: #c97b1e;
    --muted: #8a6a4a;
    --glass-border: #3a2210;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    user-select: none;
    transition: background 2.5s ease;
  }
  .quote {
    max-width: 480px;
    text-align: center;
    height: 84px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 8px;
    opacity: 1;
    transition: opacity 1.2s ease;
    padding: 0 20px;
  }
  .quote.faded { opacity: 0; }
  .quote-text {
    font-size: 18px;
    font-style: italic;
    color: var(--text);
    line-height: 1.5;
    height: 54px;
  }
  .quote-author {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    transition: color 1s;
  }
  .mode-toggle {
    display: flex;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 -1px 0 rgba(0, 0, 0, 0.15),
      0 8px 32px rgba(0, 0, 0, 0.25);
    border-radius: 999px;
    padding: 4px;
    transition: background 2s, border-color 2s;
  }
  .mode-toggle button {
    position: relative;
    background: transparent;
    border: none;
    padding: 9px 24px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    border-radius: 999px;
    cursor: pointer;
    transition: color .4s, background .4s, box-shadow .4s;
  }
  .mode-toggle button.active {
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.22),
      rgba(255, 255, 255, 0.08));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    font-weight: 600;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -1px 1px rgba(0, 0, 0, 0.1),
      0 2px 10px rgba(0, 0, 0, 0.2);
  }
  .ring-wrap { position: relative; width: 300px; height: 300px; }
  svg { transform: rotate(-90deg); }
  .ring-bg { stroke: var(--surface); transition: stroke 2s; }
  .ring {
    transition: stroke-dashoffset 1s linear, stroke 2s;
    stroke-linecap: round;
  }
  .time {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 64px;
    font-variant-numeric: tabular-nums;
    font-weight: 200;
  }
  .phase-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .controls { display: flex; gap: 14px; }
  .controls button {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px) saturate(1.5);
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 -1px 0 rgba(0, 0, 0, 0.15),
      0 6px 24px rgba(0, 0, 0, 0.22);
    padding: 12px 32px;
    font-size: 15px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 2s, border-color 2s, transform .1s, filter .2s;
  }
  .controls button:hover { background: rgba(255, 255, 255, 0.11); }
  .controls button:active { transform: scale(.96); }
  .controls button.primary {
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.22),
      rgba(255, 255, 255, 0.07));
    border-color: rgba(255, 255, 255, 0.22);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -1px 1px rgba(0, 0, 0, 0.1),
      0 6px 24px rgba(0, 0, 0, 0.28);
    font-weight: 600;
    min-width: 130px;
  }
  .controls button.primary:hover { filter: brightness(1.15); }
  .controls button.primary.break { border-color: rgba(75, 177, 160, 0.45); }
  .sessions { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 1px solid var(--glass-border); transition: border-color 1s, background .3s; }
  .dot.done { background: var(--accent); border-color: transparent; }
  .hint { color: var(--muted); font-size: 12.5px; }
  kbd {
    background: var(--surface); border: 1px solid var(--glass-border); border-radius: 5px;
    padding: 1px 7px; font-size: 11.5px; font-family: inherit;
    transition: background 1s, border-color 1s;
  }
</style>
</head>
<body>
  <div class="quote" id="quote">
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-author" id="quoteAuthor"></div>
  </div>

  <div class="mode-toggle">
    <button id="modeDeep" class="active">Deep Work</button>
    <button id="modeHyper">Hyperfocus</button>
  </div>

  <div class="ring-wrap">
    <svg width="300" height="300">
      <circle class="ring-bg" cx="150" cy="150" r="136" fill="none" stroke-width="10"/>
      <circle class="ring" id="ring" cx="150" cy="150" r="136" fill="none"
              stroke="#e8b04b" stroke-width="10"
              stroke-dasharray="854.5" stroke-dashoffset="0"/>
    </svg>
    <div class="time" id="time">52:00</div>
  </div>
  <div class="phase-label" id="phaseLabel">Focus</div>

  <div class="controls">
    <button class="primary" id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <button id="skipBtn">Skip</button>
  </div>
  <div class="sessions">
    <span>Sessions completed</span>
    <div class="dots" id="dots"></div>
  </div>
  <div class="hint"><kbd>Space</kbd> start / pause &nbsp;·&nbsp; <kbd>R</kbd> reset &nbsp;·&nbsp; <kbd>S</kbd> skip</div>

<script>
const QUOTES = [
  ["The successful warrior is the average man, with laser-like focus.", "Bruce Lee"],
  ["Concentrate all your thoughts upon the work in hand. The sun's rays do not burn until brought to a focus.", "Alexander Graham Bell"],
  ["It is during our darkest moments that we must focus to see the light.", "Aristotle Onassis"],
  ["Lack of direction, not lack of time, is the problem. We all have twenty-four hour days.", "Zig Ziglar"],
  ["Where focus goes, energy flows.", "Tony Robbins"],
  ["You will never reach your destination if you stop and throw stones at every dog that barks.", "Winston Churchill"],
  ["The main thing is to keep the main thing the main thing.", "Stephen Covey"],
  ["Do the hard jobs first. The easy jobs will take care of themselves.", "Dale Carnegie"],
  ["Focus is a matter of deciding what things you're not going to do.", "John Carmack"],
  ["Simplicity is the ultimate sophistication.", "Leonardo da Vinci"],
  ["What gets measured gets managed.", "Peter Drucker"],
  ["The shorter way to do many things is to do only one thing at a time.", "Mozart"],
  ["Lost time is never found again.", "Benjamin Franklin"],
  ["Action is the foundational key to all success.", "Pablo Picasso"],
  ["Deep work is the ability to focus without distraction on a cognitively demanding task.", "Cal Newport"],
  ["Either you run the day or the day runs you.", "Jim Rohn"],
];

const MODES = {
  deep:  { work: 52, break: 17 },
  hyper: { work: 25, break: 5 },
};
let mode = 'deep';
let phase = 'work';
let total = MODES[mode].work * 60;
let remaining = total;
let running = false;
let timerId = null;
let sessions = 0;
let quoteIdx = Math.floor(Math.random() * QUOTES.length);

const timeEl = document.getElementById('time');
const phaseLabel = document.getElementById('phaseLabel');
const ringEl = document.getElementById('ring');
const startBtn = document.getElementById('startBtn');
const dotsEl = document.getElementById('dots');
const quoteEl = document.getElementById('quote');
const quoteText = document.getElementById('quoteText');
const quoteAuthor = document.getElementById('quoteAuthor');
const CIRC = 854.5;

// ---- quotes: rotate every 30s with fade ----
function showQuote(i) {
  quoteText.textContent = '\u201C' + QUOTES[i][0] + '\u201D';
  quoteAuthor.textContent = QUOTES[i][1];
}
showQuote(quoteIdx);
setInterval(() => {
  quoteEl.classList.add('faded');
  setTimeout(() => {
    quoteIdx = (quoteIdx + 1) % QUOTES.length;
    showQuote(quoteIdx);
    quoteEl.classList.remove('faded');
  }, 1200); // matches CSS transition duration
}, 30000);

let audioCtx;
function chime(freqs) {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  freqs.forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.18;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o.start(t); o.stop(t + 1.3);
  });
}

function fmt(s) {
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function accentColor() {
  return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
}

function render() {
  timeEl.textContent = fmt(remaining);
  document.title = fmt(remaining) + ' \u2014 ' + (phase === 'work' ? 'Focus' : 'Break');
  ringEl.style.strokeDashoffset = CIRC * (1 - remaining / total);
  ringEl.style.stroke = phase === 'work' ? accentColor()
    : getComputedStyle(document.documentElement).getPropertyValue('--break').trim();
  phaseLabel.textContent = phase === 'work' ? 'Focus' : 'Break';
  startBtn.className = 'primary' + (phase === 'break' ? ' break' : '');
  startBtn.textContent = running ? 'Pause' : (remaining < total ? 'Resume' : 'Start');
  dotsEl.innerHTML = '';
  const done = sessions % 4 === 0 && sessions > 0 ? 4 : sessions % 4;
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < done ? ' done' : '');
    dotsEl.appendChild(d);
  }
}

function setPhase(p, silent) {
  phase = p;
  total = remaining = (p === 'work' ? MODES[mode].work : MODES[mode].break) * 60;
  if (!silent) {
    if (p === 'work') chime([523, 659]);
    else chime([784, 587, 440]);
  }
  render();
}

function setMode(m) {
  mode = m;
  document.body.classList.toggle('hyper', m === 'hyper');
  document.getElementById('modeDeep').classList.toggle('active', m === 'deep');
  document.getElementById('modeHyper').classList.toggle('active', m === 'hyper');
  clearInterval(timerId);
  running = false;
  setPhase('work', true);
}

function tick() {
  remaining--;
  if (remaining < 0) {
    if (phase === 'work') { sessions++; setPhase('break'); }
    else setPhase('work');
    return;
  }
  render();
}

function toggle() {
  running = !running;
  if (running) timerId = setInterval(tick, 1000);
  else clearInterval(timerId);
  render();
}

function reset() {
  clearInterval(timerId);
  running = false;
  remaining = total;
  render();
}

function skip() {
  clearInterval(timerId);
  if (phase === 'work' && remaining < total) sessions++;
  setPhase(phase === 'work' ? 'break' : 'work');
}

document.getElementById('startBtn').onclick = toggle;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('skipBtn').onclick = skip;
document.getElementById('modeDeep').onclick = () => setMode('deep');
document.getElementById('modeHyper').onclick = () => setMode('hyper');
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 's' || e.key === 'S') skip();
});

render();
</script>
</body>
</html>
